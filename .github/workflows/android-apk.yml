
name: Publish Elaf Accessories APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Release Project
        run: |
          unzip -o ElafAccessoriesAndroid_Project_Release.zip -d .
          rm -f ElafAccessoriesAndroid/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elaf-release-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/elaf-release-key.jks" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p ElafAccessoriesAndroid assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elaf-Accessories-Release-APK
          path: ElafAccessoriesAndroid/app/build/outputs/apk/release/app-release.apk

      - name: Publish Public Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Elaf Accessories v1.0.0
          body: |
            Official Android release of Elaf Accessories.
          files: ElafAccessoriesAndroid/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
