
name: Build Elaf Accessories APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o ElafAccessoriesAndroid_Project_Updated_Icon.zip -d .
          rm -f ElafAccessoriesAndroid/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Build APK
        run: |
          gradle --no-daemon -p ElafAccessoriesAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elaf-Accessories-APK
          path: ElafAccessoriesAndroid/app/build/outputs/apk/debug/app-debug.apk
